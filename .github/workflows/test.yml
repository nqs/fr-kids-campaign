name: Tests

on:
  push:
    paths:
      - 'transcribe.sh'
      - 'tests/**'
      - '.github/workflows/test.yml'
  pull_request:
    paths:
      - 'transcribe.sh'
      - 'tests/**'
      - '.github/workflows/test.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Run transcribe.sh tests
        run: ./tests/test_transcribe.sh
