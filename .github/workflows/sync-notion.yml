name: Sync Notion

# Pushes changed campaign-guide Markdown into the live Notion workspace, so
# Notion stays a mirror of the repo instead of drifting. On every push to
# main that touches mapped content, scripts/sync_notion.py converts each
# changed file's Markdown to Notion blocks and replaces that page's content
# via the Notion REST API.
#
# Prerequisite: a NOTION_TOKEN repo secret (Settings -> Secrets and
# variables -> Actions) holding an internal Notion integration token, and
# that integration must be shared with every page listed in
# scripts/notion_sync_map.json (Notion page -> "..." -> Connections -> add
# the integration). Files not yet listed in that map are skipped with a
# warning rather than failing the run.

on:
  push:
    branches: [main]
    paths:
      - 'Home.md'
      - 'AGENTS.md'
      - 'dnd-adventure-generator.md'
      - 'campaign/**'
      - 'sessions/**'
      - 'scripts/sync_notion.py'
      - 'scripts/notion_sync_map.json'
      - '.github/workflows/sync-notion.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-notion
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Determine changed Markdown files
        id: changed
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "all=true" >> "$GITHUB_OUTPUT"
          else
            files=$(git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" -- \
              Home.md AGENTS.md dnd-adventure-generator.md 'campaign/*.md' 'campaign/**/*.md' 'sessions/**/*.md' \
              | tr '\n' ' ')
            echo "all=false" >> "$GITHUB_OUTPUT"
            echo "files=$files" >> "$GITHUB_OUTPUT"
          fi

      - name: Sync changed pages to Notion
        if: steps.changed.outputs.all == 'true' || steps.changed.outputs.files != ''
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          WIKI_SOURCE_BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ "${{ steps.changed.outputs.all }}" = "true" ]; then
            python3 scripts/sync_notion.py --all
          else
            python3 scripts/sync_notion.py ${{ steps.changed.outputs.files }}
          fi
