name: Transcribe audio

on:
  push:
    paths:
      - '**.m4a'
      - '**.mp3'
      - '**.wav'
      - '**.webm'
      - '**.flac'
      - '**.ogg'
  workflow_dispatch:
    inputs:
      all-files:
        description: 'Transcribe every audio file in the repo (backfill)'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: transcribe-${{ github.ref }}
  cancel-in-progress: false

jobs:
  transcribe:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: false

      - uses: actions/checkout@v5
        with:
          fetch-depth: 2
          lfs: true

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11.9'

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-whisperx-v2

      - uses: actions/cache@v5
        with:
          path: ~/.cache/huggingface
          key: hf-${{ runner.os }}-whisperx-base.en

      - name: Find audio files to transcribe
        id: find
        env:
          ALL_FILES: ${{ inputs.all-files }}
          BEFORE: ${{ github.event.before }}
        run: |
          regex='\.(m4a|mp3|wav|webm|flac|ogg)$'
          if [ "${ALL_FILES:-false}" = "true" ]; then
            git ls-files | grep -Ei "$regex" > audio_files.txt || true
          else
            if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
              BEFORE="$(git rev-parse HEAD~1 2>/dev/null || echo '')"
            fi
            if [ -n "$BEFORE" ]; then
              git diff --name-only --diff-filter=AM "$BEFORE" HEAD \
                | grep -Ei "$regex" > audio_files.txt || true
            else
              git ls-files | grep -Ei "$regex" > audio_files.txt || true
            fi
          fi
          count=$(wc -l < audio_files.txt | tr -d ' ')
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "Found $count audio file(s) to transcribe."
          cat audio_files.txt || true

      - name: Transcribe
        if: steps.find.outputs.count != '0'
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          SKIP_PYENV: '1'
        run: |
          chmod +x ./scripts/transcribe.sh
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            echo "::group::Transcribing $f"
            ./scripts/transcribe.sh "$f" "$f.txt" || echo "::warning::Failed to transcribe $f"
            echo "::endgroup::"
          done < audio_files.txt
          rm -f audio_files.txt

      - name: Commit transcripts
        if: steps.find.outputs.count != '0'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- ':(glob)**/*.txt'
          if git diff --cached --quiet; then
            echo "No transcript changes to commit."
            exit 0
          fi
          git commit -m "chore: add transcripts [skip ci]"
          git push
